name: إنشاء مسودة فيديو باللغة العربية

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Arabic-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run video generation script
        run: python scripts/generate_video.py

      - name: Upload artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: مسودة-فيديو-أرافيك-ذكاء
          path: output/
          if-no-files-found: error
          retention-days: 7
